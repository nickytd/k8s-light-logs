---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VLogs
metadata:
  name: single
spec:
  image:
    repository: victoriametrics/victoria-logs
    tag: v1.8.0-victorialogs
  logLevel: INFO
  retentionPeriod: 7d
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
